name: Continuous Integration Test Suite

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test-and-package:
    name: Compile Native GTK 3, Verify Multi-Distro .deb & Run Web Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install native GTK 3 & X11 development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libx11-dev \
            dpkg-dev \
            binutils \
            xvfb \
            xauth

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install npm dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-package-lock --no-audit --no-fund
          fi

      - name: Compile native GTK 3 binary & build Debian (.deb) package
        run: bash ./scripts/build-deb.sh

      # run-tests.sh gates: C unit -> Xvfb GTK canvas (make -C native test-gtk) -> ELF/.deb (incl.
      # X11 XGrabKey collision) -> TS parity -> web UI (npm run test:ui) -> tsc --noEmit
      - name: Execute full repository test suite (C + GTK canvas + ELF/.deb + TypeScript + web UI)
        run: bash ./scripts/run-tests.sh

      - name: Verify production web build (after full test suite)
        run: npm run build
