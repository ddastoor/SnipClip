name: Continuous Integration Test Suite

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test-and-package:
    name: Compile Native GTK 3, Verify Multi-Distro .deb & Run Web Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install native GTK 3 & X11 development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libx11-dev \
            dpkg-dev \
            binutils

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Compile native GTK 3 binary & build Debian (.deb) package
        run: |
          chmod +x scripts/build-deb.sh scripts/run-tests.sh
          ./scripts/build-deb.sh

      - name: Execute full repository test suite (C + ELF/.deb + TypeScript)
        run: ./scripts/run-tests.sh

      - name: Verify production web build
        run: npm run build
