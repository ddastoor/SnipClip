name: Build and Release Debian (.deb) Package

on:
  push:
    branches:
      - main
      - master
    paths:
      - "VERSION"
      - "native/**"
      - "packaging/**"
      - "scripts/build-deb.sh"
      - "scripts/generate_icons.py"
      - ".github/workflows/release-deb.yml"
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Semantic version for the .deb release (e.g., 2.1.0)"
        required: true
        default: "2.1.0"

permissions:
  contents: write

jobs:
  build-deb-release:
    name: Compile Native GTK 3 ELF .deb (Debian Bookworm ABI Baseline) & Publish Release
    runs-on: ubuntu-latest
    # Compile against Debian 12 Bookworm (glibc 2.35/2.36) so the amd64 ELF binary runs cleanly
    # across Debian 12/13, Ubuntu 22.04/24.04/24.10/25.04, Mint 21/22, Pop!_OS, Kubuntu, Kali & MX Linux
    container:
      image: debian:bookworm

    steps:
      - name: Install native GTK 3 / X11 compiler & Debian packaging toolchain
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libx11-dev \
            python3 \
            dpkg-dev \
            binutils \
            ca-certificates \
            git

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release version from VERSION file, GitHub tag, or input
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RAW_VER="${{ inputs.release_version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RAW_VER="${GITHUB_REF_NAME}"
          else
            RAW_VER="$(tr -d '[:space:]' < VERSION)"
          fi
          CLEAN_VER="${RAW_VER#v}"
          ARCH="$(dpkg --print-architecture)"
          echo "version=${CLEAN_VER}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${CLEAN_VER}" >> "${GITHUB_OUTPUT}"
          echo "deb_file=snipclip_${CLEAN_VER}_${ARCH}.deb" >> "${GITHUB_OUTPUT}"

      - name: Compile native GTK 3 binary & build .deb synced to ${{ steps.meta.outputs.version }}
        run: |
          chmod +x scripts/build-deb.sh
          ./scripts/build-deb.sh "${{ steps.meta.outputs.version }}"

      - name: Run native C unit tests & multi-distro .deb verification suite
        run: |
          make -C native test
          python3 -m unittest discover -s linux/tests -p "test_*.py" -v
          dpkg-deb --info "public/releases/${{ steps.meta.outputs.deb_file }}"
          dpkg-deb --contents "public/releases/${{ steps.meta.outputs.deb_file }}"

      - name: Upload .deb artifact to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.deb_file }}
          path: |
            public/releases/${{ steps.meta.outputs.deb_file }}
            public/releases/SHA256SUMS

      - name: Publish .deb to GitHub Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "SnipClip ${{ steps.meta.outputs.tag }} (Native GTK 3)"
          generate_release_notes: true
          body: |
            ## SnipClip ${{ steps.meta.outputs.tag }} — Native Compiled GTK 3 Debian/Ubuntu Installer (.deb)

            Natively compiled C11 + GTK 3 + Cairo Windows 11 Snipping Tool clone for Debian-based Linux distributions (**Debian 12/13**, **Ubuntu 22.04 / 24.04 / 24.10 / 25.04**, **Kubuntu**, **Linux Mint 21/22**, **Pop!_OS**, **Kali**, **Zorin OS**, **MX Linux**) with automatic **X11** and **Wayland** startup detection.

            ### Graphical Installation & Launch (Zero Command Line Required)
            1. Download **`${{ steps.meta.outputs.deb_file }}`** below.
            2. **Double-click** the `.deb` file in your File Explorer (Dolphin, GNOME Files, Nemo, Thunar) to open **KDE Discover**, **GNOME Software**, or **GDebi**, then click **Install** (or **Update**).
            3. Click **Launch** directly inside the GUI installer, or open **SnipClip** from your desktop's **Application Launcher** (`Utilities` / `Graphics`). SnipClip automatically detects **Wayland** or **X11** on startup.
          files: |
            public/releases/${{ steps.meta.outputs.deb_file }}
            public/releases/SHA256SUMS
